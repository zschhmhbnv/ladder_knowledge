title: "🚀2026机场节点与机场套餐推荐｜线路、流量、价格对比"
tagline: "从节点地区、线路倍率到流量额度与套餐有效期，按自己的使用需求挑选合适的机场服务。"
description: "整理机场节点、线路特点、套餐价格、流量与有效期等信息，方便横向比较不同服务。无论关注节点选择、流量是否有期限，还是套餐预算，都可以先了解规则再按需挑选；具体服务与套餐信息以页面更新及服务方说明为准。"
lang: "zh-CN"

# 保持您原本的 Markdown 渲染機制
markdown: kramdown

url: "https://airports.win/"
baseurl: "" 

# 1. 启用自动处理标题的插件
plugins:
  - jekyll-titles-from-headings

# 2. 更改为开启状态，并设置剥离正文中的首个 h1
titles_from_headings:
  enabled: true
  strip_title: true
defaults:
  - scope:
      path: "" # 代表全站，包含自動生成的 index.html
    values:
      layout: "default" # 套用主題的預設寬度居中樣式
